<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standing with Chaniya — Live Total</title>
<!--
  Minimal embed: the live grand total + a "last updated" timestamp. Nothing else.
  Marketing wraps their own heading / layout / surrounding design around this
  iframe in Wix.

  Optional URL query parameters for styling — Marketing can self-serve the look
  by editing the iframe `src` in Wix, no code changes needed:

    size       number font size in px        ?size=80          (default 64)
    weight     number font weight            ?weight=600       (default 700)
    color      hex color, with or without #  ?color=7c3aed     (default auto: dark on light / light on dark)
    decimals   digits after the dollar       ?decimals=0       (default 2)
    align      left | center | right         ?align=left       (default center)
    timestamp  on | off                      ?timestamp=off    (default on)

  Combine freely:  index.html?size=80&color=7c3aed&align=left

  The number + timestamp auto-refresh every 5 minutes while the page is open.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;        /* overridden by ?align= */
    justify-content: center;
    min-height: 100vh;
    padding: 8px;
    text-align: center;
  }

  #amount {
    font-size: 64px;            /* overridden by ?size= */
    font-weight: 700;           /* overridden by ?weight= */
    color: #1c1917;             /* overridden by ?color=, or by dark mode below */
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #updated {
    margin-top: 6px;
    font-size: 13px;
    color: #57534e;
  }

  .error { font-size: 14px !important; font-weight: 400 !important; color: #991b1b !important; }

  @media (prefers-color-scheme: dark) {
    #amount  { color: #f5f5f4; }
    #updated { color: #a8a29e; }
  }
</style>
</head>
<body>
  <div id="amount">…</div>
  <div id="updated"></div>

  <script>
    const REFRESH_MS = 5 * 60 * 1000;
    const params = new URLSearchParams(location.search);
    const amountEl = document.getElementById("amount");
    const updatedEl = document.getElementById("updated");

    // ----- apply styling from URL params -----
    const sizeParam = parseInt(params.get("size"), 10);
    if (!isNaN(sizeParam)) amountEl.style.fontSize = sizeParam + "px";

    if (params.get("weight")) amountEl.style.fontWeight = params.get("weight");

    if (params.get("color")) {
      let c = params.get("color").trim();
      if (!c.startsWith("#")) c = "#" + c;
      amountEl.style.color = c;   // inline style beats the dark-mode stylesheet rule
    }

    const alignMap = { left: "flex-start", center: "center", right: "flex-end" };
    const alignKey = (params.get("align") || "").toLowerCase();
    if (alignMap[alignKey]) {
      document.body.style.alignItems = alignMap[alignKey];
      document.body.style.textAlign = alignKey;
    }

    let decimals = 2;
    const decParam = params.get("decimals");
    if (decParam !== null && !isNaN(parseInt(decParam, 10))) {
      decimals = parseInt(decParam, 10);
    }

    const showTimestamp = (params.get("timestamp") || "on").toLowerCase() !== "off";
    if (!showTimestamp) updatedEl.style.display = "none";

    // ----- formatting helpers -----
    function formatMoney(n) {
      return "$" + n.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function formatUpdated(iso) {
      const d = new Date(iso);
      const datePart = d.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles", month: "short", day: "numeric",
      });
      const timePart = d.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles",
        hour: "numeric", minute: "2-digit", hour12: true,
      });
      return `Updated ${datePart} at ${timePart} PT`;
    }

    // ----- fetch + render -----
    async function loadTotal() {
      try {
        const resp = await fetch("totals.json?_=" + Date.now(), { cache: "no-cache" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        amountEl.classList.remove("error");
        amountEl.textContent = formatMoney(data.grand_total);
        if (showTimestamp) updatedEl.textContent = formatUpdated(data.fetched_at_utc);
      } catch (err) {
        console.error("Failed to load totals.json:", err);
        amountEl.classList.add("error");
        amountEl.textContent = "Total unavailable";
        updatedEl.textContent = "";
      }
    }

    loadTotal();
    setInterval(loadTotal, REFRESH_MS);
  </script>
</body>
</html>
