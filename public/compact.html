<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standing with Chaniya — Live Total</title>
<style>
  :root {
    --color-text: #1c1917;
    --color-muted: #57534e;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }

  body {
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 14px 16px;
    text-align: center;
  }

  .line {
    font-size: clamp(18px, 3vw, 24px);
    line-height: 1.35;
    color: var(--color-text);
  }

  .amount {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .updated {
    margin-top: 4px;
    font-size: 12px;
    color: var(--color-muted);
  }

  .error { color: #991b1b; font-size: 14px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-text: #f5f5f4;
      --color-muted: #a8a29e;
    }
  }
</style>
</head>
<body>
  <div id="root"><div class="line">Loading…</div></div>

  <script>
    const REFRESH_MS = 5 * 60 * 1000;

    async function loadTotals() {
      try {
        const resp = await fetch("totals.json?_=" + Date.now(), { cache: "no-cache" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        render(await resp.json());
      } catch (err) {
        console.error("Failed to load totals.json:", err);
        document.getElementById("root").innerHTML =
          '<div class="error">Total temporarily unavailable.</div>';
      }
    }

    function formatMoney(n) {
      return "$" + n.toLocaleString("en-US", {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }

    function formatUpdated(iso) {
      const d = new Date(iso);
      const datePart = d.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles", month: "short", day: "numeric",
      });
      const timePart = d.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles",
        hour: "numeric", minute: "2-digit", hour12: true,
      });
      return `${datePart} at ${timePart} PT`;
    }

    function render(data) {
      document.getElementById("root").innerHTML = `
        <div class="line">
          Together, we've raised
          <span class="amount">${formatMoney(data.grand_total)}</span>
          for Chaniya
        </div>
        <div class="updated">Updated ${formatUpdated(data.fetched_at_utc)}</div>
      `;
    }

    loadTotals();
    setInterval(loadTotals, REFRESH_MS);
  </script>
</body>
</html>
